<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750" fill="none">
  <defs>
    <linearGradient id="bgHopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9FD"/>
      <stop offset="50%" stop-color="#F3EEF9"/>
      <stop offset="100%" stop-color="#E9E1F3"/>
    </linearGradient>
    <linearGradient id="gemHopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8068B8"/>
      <stop offset="100%" stop-color="#49338A"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#49338A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Fundo suave e acetinado -->
  <rect width="600" height="750" fill="url(#bgHopeGrad)"/>
  <rect x="20" y="20" width="560" height="710" rx="16" fill="none" stroke="#E2D8EE" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Emblema de Cristal com Facetas -->
  <g transform="translate(300, 310)" filter="url(#softGlow)">
    <!-- Aura de luz sutil -->
    <circle cx="0" cy="0" r="105" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="0" cy="0" r="90" fill="#FAF7FC" stroke="#D8CEEA" stroke-width="1.5"/>

    <!-- Silhueta geométrica de Cristal Natural -->
    <polygon points="0,-65 48,-20 30,55 -30,55 -48,-20" fill="#F4EFFB" stroke="url(#gemHopeGrad)" stroke-width="2.2" stroke-linejoin="round"/>
    <polyline points="0,-65 0,55" fill="none" stroke="url(#gemHopeGrad)" stroke-width="1.6" opacity="0.75"/>
    <polyline points="-48,-20 0,-10 48,-20" fill="none" stroke="url(#gemHopeGrad)" stroke-width="1.6" opacity="0.75"/>
    <polyline points="-30,55 0,-10 30,55" fill="none" stroke="url(#gemHopeGrad)" stroke-width="1.6" opacity="0.75"/>

    <!-- Brilhos estelares decorativos -->
    <path d="M 52 -50 Q 52 -42 60 -42 Q 52 -42 52 -34 Q 52 -42 44 -42 Q 52 -42 52 -50 Z" fill="#B8B3E2"/>
    <path d="M -54 30 Q -54 36 -48 36 Q -54 36 -54 42 Q -54 36 -60 36 Q -54 36 -54 30 Z" fill="#B8B3E2"/>
  </g>

  <!-- Tipografia Editorial Premium Hope -->
  <text x="300" y="460" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="20" font-weight="600" letter-spacing="5" fill="#49338A">HOPE CRISTAIS</text>
  <line x1="260" y1="480" x2="340" y2="480" stroke="#B8B3E2" stroke-width="1"/>
  <text x="300" y="508" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#7A6899">FOTO EM ATUALIZAÇÃO</text>
  <text x="300" y="534" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#9C8DB8">Peça autêntica, selecionada &amp; energizada</text>
</svg>
